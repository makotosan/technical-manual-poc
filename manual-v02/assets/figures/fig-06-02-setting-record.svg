<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc">
<title id="title">図6-2 設定変更の承認</title>
<desc id="desc">品種と現行版を照合 → 変更前値を記録 → 許可範囲だけ変更 → 承認済み試運転 → 結果と承認者を保存</desc>
<rect width="1120" height="580" fill="white"/>
<g font-family="Yu Gothic, sans-serif" fill="#183345">
<text x="42" y="58" font-size="28" font-weight="700">図6-2 設定変更の承認</text>
<rect x="45" y="160" width="186" height="160" rx="10" fill="#edf3f7" stroke="#315c77" stroke-width="2"/>
<circle cx="75" cy="192" r="17" fill="#315c77"/><text x="75" y="199" text-anchor="middle" font-size="20" fill="white">1</text>
<text x="59" y="237" font-size="18">品種と現行版を照合</text>
<path d="M236 245h17l-5-5m5 5-5 5" fill="none" stroke="#315c77" stroke-width="3"/>
<rect x="258" y="160" width="186" height="160" rx="10" fill="#edf3f7" stroke="#315c77" stroke-width="2"/>
<circle cx="288" cy="192" r="17" fill="#315c77"/><text x="288" y="199" text-anchor="middle" font-size="20" fill="white">2</text>
<text x="272" y="237" font-size="18">変更前値を記録</text>
<path d="M449 245h17l-5-5m5 5-5 5" fill="none" stroke="#315c77" stroke-width="3"/>
<rect x="471" y="160" width="186" height="160" rx="10" fill="#edf3f7" stroke="#315c77" stroke-width="2"/>
<circle cx="501" cy="192" r="17" fill="#315c77"/><text x="501" y="199" text-anchor="middle" font-size="20" fill="white">3</text>
<text x="485" y="237" font-size="18">許可範囲だけ変更</text>
<path d="M662 245h17l-5-5m5 5-5 5" fill="none" stroke="#315c77" stroke-width="3"/>
<rect x="684" y="160" width="186" height="160" rx="10" fill="#edf3f7" stroke="#315c77" stroke-width="2"/>
<circle cx="714" cy="192" r="17" fill="#315c77"/><text x="714" y="199" text-anchor="middle" font-size="20" fill="white">4</text>
<text x="698" y="237" font-size="18">承認済み試運転</text>
<path d="M875 245h17l-5-5m5 5-5 5" fill="none" stroke="#315c77" stroke-width="3"/>
<rect x="897" y="160" width="186" height="160" rx="10" fill="#edf3f7" stroke="#315c77" stroke-width="2"/>
<circle cx="927" cy="192" r="17" fill="#315c77"/><text x="927" y="199" text-anchor="middle" font-size="20" fill="white">5</text>
<text x="911" y="237" font-size="18">結果と承認者を保存</text>
<text x="45" y="400" font-size="19">安全関連設定を一般操作で変更しない。判定精度や遅延の具体値は未検証。</text>
<text x="45" y="535" font-size="17">架空TM-100の編集・出版検証用。実機の施工・安全性能を示す図ではありません。</text></g></svg>
