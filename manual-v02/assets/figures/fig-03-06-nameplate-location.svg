<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
<title id="title">TM-100 装置銘板NP01の貼付位置</title>
<desc id="desc">操作側から見た全体図。銘板は右前面の固定外装面。可動カバー、開口部、警告ラベルを避ける。</desc>
<rect width="1120" height="800" fill="white"/>
<g font-family="Yu Gothic, Arial, sans-serif" fill="#203646">
<text x="40" y="55" font-size="30">TM-100  装置銘板の貼付位置  NP01</text>
<text x="40" y="92" font-size="20">操作側から見た概念図／縮尺なし／架空PoC用</text>
<rect x="120" y="220" width="760" height="290" rx="12" fill="#e7edf1" stroke="#40596b" stroke-width="3"/>
<rect x="160" y="250" width="680" height="100" fill="#bdd2dd" stroke="#40596b"/>
<rect x="170" y="365" width="130" height="90" fill="#f6f8fa" stroke="#40596b"/>
<circle cx="200" cy="405" r="12" fill="#b82f2f"/>
<rect x="700" y="399" width="130" height="57" rx="3" fill="#e1e1e1" stroke="#172f43" stroke-width="3"/>
<rect x="165" y="510" width="40" height="75" fill="#8da7b6"/>
<rect x="795" y="510" width="40" height="75" fill="#8da7b6"/>
<path d="M90 590H920 M200 296H770l-20-10m20 10-20 10" fill="none" stroke="#40596b" stroke-width="4"/>
<text x="320" y="285" font-size="20">M02 ベルト／G02 カバー・開口部</text>
<text x="175" y="480" font-size="18">CP01 操作部</text>
<text x="706" y="433" font-size="23">NP01</text>
<text x="400" y="487" font-size="23">M01 本体固定外装</text>
<path d="M765 400L955 175" stroke="#294f6b" stroke-width="3" fill="none"/>
<rect x="745" y="120" width="325" height="75" rx="7" fill="#f2f5f7" stroke="#294f6b"/>
<text x="760" y="149" font-size="21">NP01：操作側右前面</text>
<text x="760" y="179" font-size="20">固定外装面へ貼付</text>
<text x="40" y="640" font-size="20">貼付寸法案：160 × 70 mm。実寸図・取付高さは設計で確定。</text>
<text x="40" y="681" font-size="20">ガードを開けずに読める位置。可動カバー・開口部・警告表示と重ねない。</text>
<text x="40" y="722" font-size="20">材質・固定方法・耐久性・読取性を確認し、清掃や点検を妨げないこと。</text>
<text x="40" y="763" font-size="19">図3-6  銘板貼付位置（装置銘板の内容は図3-5を参照）</text>
</g></svg>
