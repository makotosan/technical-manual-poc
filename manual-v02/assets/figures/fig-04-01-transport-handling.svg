<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t desc"><title id="t">図4-1 梱包と運搬計画</title><desc id="desc">架空装置TM-100の梱包と運搬計画。梱包箱、仮支持台、運搬計画の承認を示す技術文書出版検証用概念図。</desc><rect width="1200" height="660" fill="#fff"/><text x="52" y="65" font-family="sans-serif" font-weight="700" font-size="31" fill="#203a4b">図4-1　梱包と運搬計画</text><rect x="72" y="120" width="1056" height="380" rx="20" fill="#f0f6fa" stroke="#708fa5" stroke-width="3"/><rect x="113" y="210" width="280" height="180" rx="16" fill="#fff" stroke="#366683" stroke-width="3"/><circle cx="253" cy="245" r="24" fill="#366683"/><text x="253" y="253" fill="#fff" text-anchor="middle" font-family="sans-serif" font-size="22">1</text><text x="253" y="318" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#203a4b">梱包箱</text><path d="M400 300 h46 l-13 -10 m13 10 l-13 10" fill="none" stroke="#bd7540" stroke-width="4"/><rect x="462" y="210" width="280" height="180" rx="16" fill="#dcecf3" stroke="#366683" stroke-width="3"/><circle cx="602" cy="245" r="24" fill="#366683"/><text x="602" y="253" fill="#fff" text-anchor="middle" font-family="sans-serif" font-size="22">2</text><text x="602" y="318" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#203a4b">仮支持台</text><path d="M749 300 h46 l-13 -10 m13 10 l-13 10" fill="none" stroke="#bd7540" stroke-width="4"/><rect x="811" y="210" width="280" height="180" rx="16" fill="#fff" stroke="#366683" stroke-width="3"/><circle cx="951" cy="245" r="24" fill="#366683"/><text x="951" y="253" fill="#fff" text-anchor="middle" font-family="sans-serif" font-size="22">3</text><text x="951" y="318" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#203a4b">運搬計画の承認</text><rect x="100" y="437" width="998" height="43" rx="9" fill="#fff3e6" stroke="#c58c50" stroke-width="2"/><text x="122" y="465" font-family="sans-serif" font-size="19" fill="#794624">H-05 落下・転倒</text><text x="70" y="552" font-