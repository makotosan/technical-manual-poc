<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="980" viewBox="0 0 1120 980" role="img" aria-labelledby="title desc">
<title id="title">TM-100 残留リスクマップ</title>
<desc id="desc">全体図のA供給、B排出、C制御盤、D支持、E端部と、位置を特定しないUを残留リスクIDで対応づける架空の編集図。</desc>
<rect width="1120" height="980" fill="white"/>
<g font-family="Noto Sans JP, Yu Gothic, sans-serif" fill="#172b3a">
<text x="40" y="44" font-size="25">TM-100 残留リスクマップ  |  TM100-RR-001 / 0.1-draft</text>
<text x="40" y="76" font-size="17">架空PoC用・縮尺なし。マップだけで作業せず、本文・統合一覧と作業別手順を読む。</text>
<rect x="245" y="200" width="640" height="230" rx="10" fill="#e8eef2" stroke="#40596b" stroke-width="3"/>
<rect x="280" y="255" width="550" height="75" fill="#b4c9d5" stroke="#40596b"/>
<path d="M330 292H760l-18-10m18 10-18 10" stroke="#24495e" stroke-width="4" fill="none"/>
<rect x="650" y="215" width="52" height="40" fill="#7b9eb1" stroke="#40596b"/>
<rect x="480" y="135" width="150" height="65" fill="#f2f5f7" stroke="#40596b" stroke-dasharray="6 4"/>
<rect x="300" y="430" width="34" height="65" fill="#8ba2b0"/>
<rect x="780" y="430" width="34" height="65" fill="#8ba2b0"/>
<path d="M180 500H940" stroke="#40596b" stroke-width="5"/>
<text x="300" y="240" font-size="18">M02 ベルト / G01 ガード</text>
<text x="710" y="242" font-size="17">A01</text>
<text x="492" y="162" font-size="18">EC01 背面</text>
<text x="380" y="395" font-size="20">M01 本体フレーム</text>
<text x="400" y="535" font-size="18">操作側：CP01 / 搬送方向 →</text>
<path d="M280 292 L100 300" stroke="#315e7a" stroke-width="2" fill="none"/>
<circle cx="100" cy="300" r="23" fill="#173f58"/>
<text x="100" y="307" font-size="21" fill="white" text-anchor="middle">A</text>
<path d="M680 245 L970 260" stroke="#315e7a" stroke-width="2" fill="none"/>
<circle cx="970" cy="260" r="23" fill="#173f58"/>
<text x="970" y="267" font-size="21" fill="white" text-anchor="middle">B</text>
<path d="M550 145 L755 132" stroke="#315e7a" stroke-width="2" fill="none"/>
<circle cx="755" cy="132" r="23" fill="#173f58"/>
<text x="755" y="139" font-size="21" fill="white" text-anchor="middle">C</text>
<path d="M800 470 L970 455" stroke="#315e7a" stroke-width="2" fill="none"/>
<circle cx="970" cy="455" r="23" fill="#173f58"/>
<text x="970" y="462" font-size="21" fill="white" text-anchor="middle">D</text>
<path d="M850 405 L985 375" stroke="#315e7a" stroke-width="2" fill="none"/>
<circle cx="985" cy="375" r="23" fill="#173f58"/>
<text x="985" y="382" font-size="21" fill="white" text-anchor="middle">E</text>
<text x="40" y="600" font-size="17">A 供給・搬送：RR-01/02 死亡・重傷、RR-09 重傷</text>
<text x="570" y="600" font-size="17">B 排出：RR-03/04 死亡・重傷、RR-09 重傷</text>
<text x="40" y="638" font-size="17">C 制御盤内部：RR-05 死亡・重傷</text>
<text x="570" y="638" font-size="17">D 支持・輸送荷：RR-07/10 死亡・重傷</text>
<text x="40" y="676" font-size="17">E 取外し端部：RR-08 軽傷</text>
<text x="570" y="676" font-size="17">危険位置とラベル取付位置は同じとは限らない。</text>
<rect x="35" y="730" width="1050" height="125" rx="8" fill="#f4f6f8" stroke="#40596b"/>
<text x="50" y="758" font-size="21">U 箇所を特定しない残留リスク（機械全体・作業状態）</text>
<text x="50" y="790" font-size="18">RR-06 不意の起動 ／ RR-11 異常復帰 ／ RR-12 解体時の残留エネルギー</text>
<text x="50" y="822" font-size="18">いずれも死亡・重傷。停止表示や非常停止だけで隔離済みと判断しない。</text>
<text x="40" y="895" font-size="17">危害の程度は想定傷害を直接表示。発生確率・リスク評価スコア・信号語の分類ではない。</text>
<text x="40" y="928" font-size="17">メーカー方策は構想上の前提。実施・有効性の証拠と機械固有手順は未確認。詳細は付録C。</text>
</g></svg>
