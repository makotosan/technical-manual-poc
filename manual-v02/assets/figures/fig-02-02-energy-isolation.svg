<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-label="図2-2 保守前のエネルギー管理（概念フロー）"><style>.t{font:700 27px sans-serif;fill:#152338}.h{font:600 19px sans-serif;fill:#152338}.s{font:16px sans-serif;fill:#27364b}.b{fill:#e8f2fb;stroke:#385b82;stroke-width:3}.g{fill:#f7fbff;stroke:#5794bb;stroke-width:3}.w{fill:#fff3df;stroke:#c45f28;stroke-width:3}.line{stroke:#385b82;stroke-width:3;fill:none}.dash{stroke:#385b82;stroke-width:2;fill:none;stroke-dasharray:8 6}</style><rect width="1120" height="650" fill="white"/><text x="40" y="50" class="t">図2-2 保守前のエネルギー管理（概念フロー）</text><rect x="60" y="175" width="220" height="110" rx="14" class="b"/><rect x="329" y="175" width="220" height="110" rx="14" class="b"/><rect x="598" y="175" width="220" height="110" rx="14" class="b"/><rect x="867" y="175" width="195" height="110" rx="14" class="g"/><text x="103" y="237" class="h">通常停止</text><text x="369" y="237" class="h">隔離・施錠</text><text x="644" y="237" class="h">残留確認</text><text x="905" y="237" class="h">作業許可</text><path d="M280 229 H329 M549 229 H598 M818 229 H867" class="line"/><path d="M320 222 l9 7 -9 7 M589 222 l9 7 -9 7 M858 222 l9 7 -9 7" fill="#385b82"/><rect x="95" y="360" width="935" height="145" rx="12" class="w"/><text x="128" y="404" class="h">警告 H-04：停止操作、非常停止、表示灯だけでは隔離を証明できません。</text><text x="128" y="444" class="s">遮断点・施錠方式・無エネルギー確認方法は実機の設計資料と作業手順から決定します。</text><text x="40" y="624" class="s">注：架空のTM-100の説明用概念図。実機の安全性能・寸法を保証しません。</text></svg>