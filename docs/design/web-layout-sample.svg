"352" y="297" class="title" fill="#000">警告</text><text x="439" y="280" class="small">予期しない起動による挟まれのおそれがあります。</text><text x="439" y="310" class="small">作業前に必要な安全状態を確認してください。</text><text x="303" y="381" class="title">調整手順</text><text x="304" y="423" class="label">1　対象ワークの仕様を確認する</text><text x="304" y="459" class="label">2　センサの取付状態を確認する</text><text x="304" y="495" class="label">3　検出状態を点検する</text><rect x="20" y="582" width="685" height="286" rx="10" fill="white" stroke="#b8c7d4"/><rect x="20" y="582" width="685" height="42" rx="9" fill="#145e9b"/><text x="39" y="610" class="cap">タブレット版：開閉式目次＋本文</text><rect x="39" y="640" width="645" height="45" fill="#0b3155"/><text x="57" y="669" class="head" font-size="18">☰　TM-100　　検索</text><text x="58" y="725" class="title">6.2 センサの調整</text><rect x="57" y="742" width="608" height="76" rx="5" fill="#fff4e7" stroke="#d57c25"/><g transform="translate(73 757) scale(0.62)"><path d="M24 2 L47 43 Q48 46 44 46 H4 Q0 46 2 42 L21 3 Q22 1 24 2 Z" fill="#ffed00" stroke="#000" stroke-width="4" stroke-linejoin="round"/><path d="M24 13 L24 31" stroke="#000" stroke-width="5" stroke-linecap="round"/><circle cx="24" cy="38" r="3.2" fill="#000"/></g><rect x="117" y="747" width="87" height="44" fill="#f39800"/><text x="130" y="776" class="label">警告</text><text x="218" y="773" class="small">作業前に安全状態を確認する</text><text x="58" y="843" class="small">本文・図表は表示幅に合わせて再配置</text><rect x="725" y="582" width="695" height="286" rx="10" fill="white" stroke="#b8c7d4"/><rect x="725" y="582" width="695" height="42" rx="9" fill="#145e9b"/><text x="745" y="610" class="cap">PDF版：Web目次を除外し全幅で組版</text><rect x="827" y="638" width="490" height="210" fill="#fff" stroke="#8799aa"/><text x="856" y="675" class="title">6.2 センサの調整</text><text x="856" y="709" class="small">本文は章別HTMLと共通の内容を使用します。</text><rect x="856" y="724" width="430" height="64" rx="4" fill="#fff4e7" stroke="#d57c25"/><g transform="translate(869 734) scale(0.62)"><path d="M24 2 L47 43 Q48 46 44 46 H4 Q0 46 2 42 L21 3