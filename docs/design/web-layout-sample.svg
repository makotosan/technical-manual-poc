<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#eef2f7"/><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#203249}.head{fill:#fff;font-size:25px;font-weight:bold}.title{font-size:23px;font-weight:bold}.label{font-size:17px}.small{font-size:14px}.cap{fill:#fff;font-size:19px;font-weight:bold}</style><rect x="20" y="20" width="1000" height="540" rx="10" fill="white" stroke="#b8c7d4"/><rect x="20" y="20" width="1000" height="58" rx="9" fill="#0b3155"/><text x="43" y="57" class="head">TM-100 取扱説明書　　｜　デスクトップ版</text><rect x="20" y="78" width="250" height="482" fill="#e7eff6"/><text x="42" y="114" class="title">目次</text><text x="40" y="152" class="small">第1章 はじめに</text><text x="40" y="186" class="small">第2章 安全上の注意</text><text x="40" y="220" class="small">第3章 装置の概要</text><text x="40" y="254" class="small">第4章 輸送・運搬</text><text x="40" y="288" class="small">第5章 据付・試運転</text><text x="40" y="322" class="small">第6章 初期設定・調整</text><text x="40" y="356" class="small">　6.1 設定の概要</text><text x="40" y="390" class="small">　6.2 センサの調整</text><text x="40" y="424" class="small">第7章 運転操作</text><text x="40" y="458" class="small">第8章 品種切替</text><text x="40" y="492" class="small">第9章 点検・保守</text><rect x="282" y="96" width="720" height="42" rx="5" fill="#f2f5f8"/><text x="299" y="122" class="small">TM-100　›　第6章　›　6.2 センサの調整</text><text x="301" y="184" class="title">6.2 センサの調整</text><text x="301" y="220" class="label">ワーク検出センサの位置と検出状態を確認します。</text><rect x="300" y="246" width="680" height="90" rx="5" fill="#fff4e7" stroke="#d57c25"/><rect x="300" y="246" width="120" height="90" fill="#f3b26c"/><text x="319" y="297" class="title">警告</text><text x="439" y="280" class="small">予期しない起動による挟まれのおそれがあります。</text><text x="439" y="310" class="small">作業前に必要な安全状態を確認してください。</text><text x="303" y="381" class="title">調整手順</text><text x="304" y="423" class="label">1　対象ワークの仕様を確認する</text><text x="304" y="459" class="label">2　センサの取付状態を確認する</text><text x="304" y="495" class="label">3　検出状態を点検する</text><rect x="20" y="582" width="685" height="286" rx="10" fill="white" stroke="#b8c7d4"/><rect x="20" y="582" width="685" height="42" rx="9" fill="#145e9b"/><text x="39" y="610" class="cap">タブレット版：開閉式目次＋本文</text><rect x="39" y="640" width="645" height="45" fill="#0b3155"/><text x="57" y="669" class="head" font-size="18">☰　TM-100　　検索</text><text x="58" y="725" class="title">6.2 センサの調整</text><rect x="57" y="742" width="608" height="76" rx="5" fill="#fff4e7" stroke="#d57c25"/><text x="74" y="770" class="label">警告：作業前に安全状態を確認する</text><text x="58" y="843" class="small">本文・図表は表示幅に合わせて再配置</text><rect x="725" y="582" width="695" height="286" rx="10" fill="white" stroke="#b8c7d4"/><rect x="725" y="582" width="695" height="42" rx="9" fill="#145e9b"/><text x="745" y="610" class="cap">PDF版：Web目次を除外し全幅で組版</text><rect x="827" y="638" width="490" height="210" fill="#fff" stroke="#8799aa"/><text x="856" y="675" class="title">6.2 センサの調整</text><text x="856" y="709" class="small">本文は章別HTMLと共通の内容を使用します。</text><rect x="856" y="724" width="430" height="64" rx="4" fill="#fff4e7" stroke="#d57c25"/><text x="873" y="751" class="label">警告：予期しない起動</text><text x="873" y="773" class="small">作業前に安全状態を確認してください。</text><text x="858" y="825" class="small">共通の注意書きはページフッターに表示</text><rect x="1040" y="20" width="380" height="540" rx="10" fill="white" stroke="#b8c7d4"/><rect x="1040" y="20" width="380" height="58" rx="9" fill="#0b3155"/><text x="1061" y="57" class="head">スマートフォン版</text><rect x="1060" y="94" width="340" height="52" fill="#0b3155"/><text x="1081" y="128" class="head" font-size="17">☰　TM-100</text><text x="1080" y="182" class="small">第6章　›　6.2</text><text x="1080" y="226" class="title">センサの調整</text><text x="1080" y="265" class="small">ワーク検出センサの</text><text x="1080" y="288" class="small">位置と状態を確認します。</text><rect x="1070" y="316" width="320" height="112" rx="5" fill="#fff4e7" stroke="#d57c25"/><text x="1084" y="344" class="title">警告</text><text x="1084" y="376" class="small">予期しない起動による</text><text x="1084" y="397" class="small">挟まれに注意してください。</text><text x="1080" y="467" class="label">1　作業前点検</text><text x="1080" y="503" class="label">2　センサ確認</text><text x="1080" y="539" class="small">← 前へ　　　次へ →</text></svg>