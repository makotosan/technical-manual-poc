name: Publish manual

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build and test HTML and PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.7.0
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned Chrome and Linux runtime dependencies
        run: |
          sudo "$(command -v node)" node_modules/@puppeteer/browsers/lib/main-cli.js install chrome@155.0.8059.84 --install-deps --path "$HOME/.cache/vivliostyle/browsers"
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/vivliostyle"
      - name: Build shared HTML once
        run: |
          npm run build:web
          sha256sum dist-web/index.html > "$RUNNER_TEMP/manual-html.sha256"
      - name: Generate PDF from existing HTML
        run: npm run build:pdf:from-html
      - name: Test existing artifacts without rebuilding
        run: npm run test:artifacts
      - name: Verify text and image propagation in isolation
        run: npm run test:propagation
      - name: Verify shared HTML before packaging
        run: sha256sum --check "$RUNNER_TEMP/manual-html.sha256"
      - name: Upload PDF for review and download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual-pdf
          path: dist-pdf/manual.pdf
          if-no-files-found: error
          retention-days: 14
      - name: Package and upload Pages HTML
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-web
      - name: Verify packaged and original HTML match
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir "$RUNNER_TEMP/pages-check"
          tar -xf "$RUNNER_TEMP/artifact.tar" -C "$RUNNER_TEMP/pages-check" ./index.html
          cmp dist-web/index.html "$RUNNER_TEMP/pages-check/index.html"
          sha256sum --check "$RUNNER_TEMP/manual-html.sha256"

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested HTML artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
